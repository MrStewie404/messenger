{% load i18n %}

{% load static %}
<link href="{% static 'default/styles.css' %}" rel="stylesheet">

<style>
    .input-text {
        text-align:left;
        padding-left: 10px;
        max-width: 90%;
        max-height: 150px;
        width: 100%;
        margin: 10px auto;
    }
</style>

<form class="window" style="margin: 10px;" method="post">
    {% csrf_token %}
    <input class="input-text" style="height: 40px;" name="title" id="id_title" placeholder="Название"></input>
    <textarea class="input-text" style="height: 150px;" name="text" cols="40" rows="10" required="" id="id_text" placeholder="Описание"></textarea>
    <input class="loginButton" style="margin-top: 10px;" type="submit" value="Добавить">
</form>
