{% extends 'flatpages/default.html' %}
{% load static %}
{% load filters %}
{% block content %}

<style>
.grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* Автоматическое создание колонок, каждая минимум 300px, растягивается */
  gap: 10px;
  padding: 10px;
  align-items: stretch;  /* Растягивание элементов по высоте */
  justify-items: stretch; /* Растягивание элементов по ширине */
}

.grid-item {
  background-color: black;
  padding: 20px;

  text-align: left; /* Выравниваем текст по левому краю */
  border-radius: 5px; /* Для скругления углов, как на скриншоте */
  margin: 2px;
  transition: all 0.25s;
  box-shadow: 0px 0px 5px rgb(0, 0, 0);
}

input[type="text"] {
    max-width: 400px;
    height: 30px;
    font-size: inherit;
    border: solid 2px black; 
    padding-left: 5px; 
    color: gray;
    background-color: rgb(50, 50, 50);
    transition: all 0.2s;
}

input[type="text"]:focus {
    /* background-color: white; */
    box-shadow: 0px 0px 100px rgba(0, 0, 0, 0);
    color: rgb(255, 255, 255);
}

input[type="checkbox"] {
    position: absolute;
    opacity: 0; /* Скрываем стандартный чекбокс */
}

input[type="checkbox"] + label {
  display: inline-block;
  width: 30px; /* Ширина квадрата */
  height: 30px; /* Высота квадрата */
  border: 4px solid #674EA7;  /* Цвет рамки */
  border-radius: 10px;  /* Закругление */
  cursor: pointer;
  position: relative;
  box-sizing: border-box;
}

input[type="checkbox"]:checked + label::before {
    content: "";
    display: block;
    position: absolute;
    top: 20%;  /* Позиционирование внутреннего квадрата */
    left: 20%;
    width: 60%; /* Ширина внутреннего квадрата */
    height: 60%;  /* Высота внутреннего квадрата */
    background-color: #674EA7; /* Цвет заполненного квадрата */
    border-radius: 3px; /* Закругление внутреннего квадрата */
    box-sizing: border-box;
}

.checkboxs {
    display: flex;
    width: 300px;
    justify-content: space-between;
}

/* style="display: flex; flex-direction: row; gap: 20px; margin-top: 20px;" */

.size_container {
    display: flex;
    flex-direction: row;
    gap: 20px;
    /* margin-top: 20px; */
    margin: 20px auto 0 auto;
}

.module_size {
    width: 150px;
}

.module_settings {
    display: block;
}

.module_preview {
    display: flex;
    height: 100px;
    margin: auto;
}

.module {
    display: flex;
    flex-direction: row;
}

* {
    color: #ffffff;
}

p {
    margin: 0;
}


/* Размытие заднего фона через overlay */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

.modal {
    background: #323232;
    border: solid 5px #564FC0;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    padding: 20px;
    margin: 30px;
    max-width: 600px;
    width: 100%;
    animation: fadeIn 0.3s ease-in-out;
    position: relative;
}

.close-btn {
    background-color: #00000000;
    border: solid 2px #ffffff20;
    color: rgba(255, 255, 255, 0.25);
    height: 25px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
}

.close-btn:hover {
    color: white;
    background-color: #564FC0;
    border-color: #564FC0;
    box-shadow: none;
}

.submit-btn {
    background-color: #00000000;
    border: solid 2px #564FC0;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
    margin-top: 5px;
    transition: all 0.2s;
}

.submit-btn:hover {
    background-color: #564FC0;
    box-shadow: none;
}

@keyframes fadeIn {
    from {
        transform: scale(0.8);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

.user-info {
    display: flex;
    position: absolute;
    bottom: 15px;
    right: 10px;
    background-color: rgb(9, 9, 9);
    border-radius: 20px;
    padding: 5px;
    padding-right: 15px;
    align-items: center;
}

.user-info img {
    width: 30px;
    height: 30px;
    border-radius: 50%;
}

.user-info p {
    font-weight: 900;
    margin: auto 0 auto 10px;
    color: rgb(200, 200, 200);
}

.modal h2 {
    text-align: center;
    font-size: x-large;
    margin-top: 0;
    margin-bottom: 20px;
}

.modal p {
    color: #808080;
    /* font-size: larger; */
}

button {
    cursor: pointer;
    border: none;
    align-items: normal;
}

button:hover {
    background-color: rgb(20, 20, 20);
    box-shadow: 0px 0px 2px rgb(255, 255, 255);
}



@media (max-width: 550px) {
    .checkboxs {
        width: 100%;
        margin: auto;
    }

    .module_size {
        width: auto;
        margin: auto;
    }

    .module {
        display: flex;
        flex-direction: column;
    }

    .module_preview {
        margin-top: 20px;
    }

    .modal {
        margin: 50px;
    }
}

</style>

<script>
    // Находим элементы
    const openModalBtns = document.querySelectorAll('.open-modal-btn'); // Все кнопки открытия
    const modalOverlay = document.getElementById('modalOverlay'); // Модальное окно
    const closeModalBtn = document.querySelector('.close-btn');   // Кнопка закрытия

    // Модальные элементы
    const modalID = document.getElementById('modalID')
    const modalTitle = document.getElementById('modalTitle');
    const modalDescription = document.getElementById('modalDescription');
    const modalAvatar = document.getElementById('modalAvatar');
    const modalUsername = document.getElementById('modalUsername');
    const profileLink = document.getElementById('profileLink');

    // Функция для открытия модального окна
    const openModal = (e) => {
      const button = e.currentTarget; // Текущая кнопка
      const id = button.dataset.id; // Забираем id из data-атрибута
      const name = button.dataset.name; // Забираем имя из data-атрибута
      const description = button.dataset.description; // Забираем описание
      const userId = button.dataset.userId; // ID пользователя
      const avatarUrl = button.dataset.avatarUrl; // URL аватара
      const username = button.dataset.username; // Имя пользователя

      // Подставляем данные в модальное окно
      modalID.textContent = id;
      modalTitle.textContent = name;
      modalDescription.textContent = description.slice(0, 127);
      modalAvatar.src = avatarUrl;
      modalUsername.textContent = username;
      profileLink.href = `/profile/${userId}`;

      // Показываем модальное окно
      modalOverlay.classList.add('active');
    };

    // Закрытие модального окна
    const closeModal = () => {
      modalOverlay.classList.remove('active');
    };

    // События для каждой кнопки
    openModalBtns.forEach((btn) => {
      btn.addEventListener('click', openModal);
    });

    // Закрытие по кнопке
    closeModalBtn.addEventListener('click', closeModal);

    // Закрытие по клику на фон
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        closeModal();
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
        const heightInput = document.getElementById('height-input');
        const widthInput = document.getElementById('width-input');
        const pcPreview = document.getElementById('pc-preview');

        const maxPercentage = 100; // Максимальный процент, до которого можно изменять размер.

        heightInput.addEventListener('input', function() {
            let height = parseFloat(heightInput.value);

            if (!isNaN(height)) {
                if(height != 0) {
                    let calculatedHeight = height / 1080 * 100;
                    calculatedHeight = Math.min(calculatedHeight, maxPercentage);
                    calculatedHeight = Math.max(calculatedHeight, 0);
                    pcPreview.style.height = calculatedHeight + '%';
                }
            } else {
                pcPreview.style.height = '50%';
            }
        });

        widthInput.addEventListener('input', function() {
            let width = parseFloat(widthInput.value);

            if (!isNaN(width)) {
                if(width != 0) {
                    let calculatedWidth = width / 1920 * 100;
                    calculatedWidth = Math.min(calculatedWidth, maxPercentage);
                    calculatedWidth = Math.max(calculatedWidth, 0);
                    pcPreview.style.width = calculatedWidth + '%';
                }
            } else {
                pcPreview.style.width = '50%';
            }
        });
    });


    document.getElementById('submit-button').addEventListener('click', function() {
        const params = {};

        // Получаем значения из полей ввода
        const heightInput = document.getElementById('height-input');
        if(heightInput && heightInput.value) {
           params.height = heightInput.value;
        } else {
            params.height = 0;
        }

        
        const widthInput = document.getElementById('width-input');
        if (widthInput && widthInput.value) {
             params.width = widthInput.value;
        } else {
            params.width = 0;
        }
        
        const id = document.getElementById('modalID').textContent;
        console.log(id);

        // Получаем значения из чекбоксов с ID, начинающимися с 'visible'
        document.querySelectorAll('input[id^="visible"]').forEach(checkbox => {
            params[checkbox.id] = checkbox.checked;
        });

        const urlParams = new URLSearchParams(params).toString();
        const newUrl = `add/${id}?${urlParams}`; // URL будет иметь вид "?param1=value1&param2=value2"

        window.open(newUrl, '_blank');
    });
</script>
