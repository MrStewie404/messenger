<script>
  const saveProfileButton = document.getElementById('save-profile-button');
  const updateProfileForm = document.getElementById('update-profile-form');

  saveProfileButton.addEventListener('click', () => {
    const formData = new FormData(updateProfileForm);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/profile/1/edit/');
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        window.location.href = `/profile/1/`;
      } else {
        console.error('Ошибка при обновлении профиля');
      }
    };
    xhr.send(formData);
  });

  // Находим элементы
  const openModalBtns = document.querySelectorAll('.open-modal-btn'); // Все кнопки открытия
  const modalOverlay = document.getElementById('modalOverlay'); // Модальное окно
  const closeModalBtn = document.querySelector('.close-btn');   // Кнопка закрытия
  
  // Модальные элементы
  const modalID = document.getElementById('modalID')
  const modalTitle = document.getElementById('modalTitle');
  const modalDescription = document.getElementById('modalDescription');
  const modalWidth = document.getElementById('width-input');
  const modalHeight = document.getElementById('height-input');
  const modalVisible = document.getElementById('visible');
  const modalVisibleForOther = document.getElementById('visible-for-other');
  const modalAvatar = document.getElementById('modalAvatar');
  const modalUsername = document.getElementById('modalUsername');
  const profileLink = document.getElementById('profileLink');
  
  // Функция для открытия модального окна
  const openModal = (e) => {
      const button = e.currentTarget;
      const id = button.dataset.id;
      const name = button.dataset.name;
      const description = button.dataset.description;
      const width = button.dataset.width;
      const height = button.dataset.height;
      const visible = button.dataset.visible;
      const visibleForOther = button.dataset.visible_for_other;
      const userId = button.dataset.userId;
      const avatarUrl = button.dataset.avatarUrl;
      const username = button.dataset.username;

      modalID.textContent = id;
      modalTitle.textContent = name;
      modalDescription.textContent = description;
      modalWidth.value = width;
      modalHeight.value = height;
      modalVisible.checked = (visible === 'true');
      modalVisibleForOther.checked = (visibleForOther === 'true');
      modalAvatar.src = avatarUrl;
      modalUsername.textContent = username;
      profileLink.href = `/profile/${userId}`;

      // Показываем модальное окно
      modalOverlay.classList.add('active');
      update_preview(modalHeight, modalWidth);
    };

    // Закрытие модального окна
  const closeModal = () => {
    modalOverlay.classList.remove('active');
  };

  // События для каждой кнопки
  openModalBtns.forEach((btn) => {
    btn.addEventListener('click', openModal);
  });

  // Закрытие по кнопке
  closeModalBtn.addEventListener('click', closeModal);

    // Закрытие по клику на фон
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) {
      closeModal();
    }
  });

  function update_preview(heightInput, widthInput) {
    const pcPreview = document.getElementById('pc-preview');
    const maxPercentage = 100;

    // Проверяем текущие значения полей (высоты и ширины) и сразу применяем изменения
    (function () {
        let height = parseFloat(heightInput.value);

        if (!isNaN(height)) {
            let calculatedHeight = height / 1080 * 100;
            calculatedHeight = Math.min(calculatedHeight, maxPercentage);
            calculatedHeight = Math.max(calculatedHeight, 0);
            pcPreview.style.height = calculatedHeight + '%';
        } else {
            pcPreview.style.height = '50%';
        }
    })();

    (function () {
        let width = parseFloat(widthInput.value);

        if (!isNaN(width)) {
            let calculatedWidth = width / 1920 * 100;
            calculatedWidth = Math.min(calculatedWidth, maxPercentage);
            calculatedWidth = Math.max(calculatedWidth, 0);
            pcPreview.style.width = calculatedWidth + '%';
        } else {
            pcPreview.style.width = '50%';
        }
    })();
  }

  document.addEventListener('DOMContentLoaded', function() {
    const heightInput = document.getElementById('height-input');
    const widthInput = document.getElementById('width-input');
  
    heightInput.addEventListener('input', () =>
      update_preview(heightInput, widthInput));
  
    widthInput.addEventListener('input', () => 
      update_preview(heightInput, widthInput));

  });



  document.querySelectorAll('.save-module-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const form = document.getElementById('module-form');
      const moduleId = document.getElementById('modalID').textContent.trim();
      const modalWidth = document.getElementById('width-input').value;
      const modalHeight = document.getElementById('height-input').value;
      const modalVisible = document.getElementById('visible').checked ? "true" : "false";
      const modalVisibleForOther = document.getElementById('visible-for-other').checked ? "true" : "false";

      // Обновляем action формы
      form.action = `/modules/upd/${moduleId}/`;

      // Добавляем данные в форму (если это не инпуты в форме)
      const widthField = form.querySelector('[name="width"]');
      const heightField = form.querySelector('[name="height"]');
      const visibleField = form.querySelector('[name="visible"]');
      const visibleForOtherField = form.querySelector('[name="visibleForOther"]');

      if (widthField) widthField.value = modalWidth;
      if (heightField) heightField.value = modalHeight;
      if (visibleField) visibleField.value = modalVisible;
      if (visibleForOtherField) visibleForOtherField.value = modalVisibleForOther;

      console.log(widthField)
      console.log(heightField)
      console.log(visibleField)
      console.log(visibleForOtherField)
    });
  });

  // Обработка отправки формы
  document.getElementById('module-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const form = e.target;
    const formData = new FormData(form);
    
    try {
        const response = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
                'X-Requested-With': 'XMLHttpRequest'
            }
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
            // Закрываем модальное окно
            console.log('Получен ответ об успехе')
            // $('#moduleModal').modal('hide');
            
            // Обновляем данные на странице
            // const moduleElement = document.querySelector(`[data-module-id="${moduleId}"]`);
            // if (moduleElement) {
            //     moduleElement.querySelector('.module-title').textContent = data.new_data.title;
            // }
            
        } else if (data.errors) {
            // Показываем ошибки валидации
            showFormErrors(data.errors);
        }
    } catch (error) {
        console.error('Ошибка:', error);
    }
  });

  // Вспомогательные функции
  function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
          const cookies = document.cookie.split(';');
          for (let i = 0; i < cookies.length; i++) {
              const cookie = cookies[i].trim();
              if (cookie.substring(0, name.length + 1) === (name + '=')) {
                  cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                  break;
              }
          }
      }
      return cookieValue;
  }

  function showFormErrors(errors) {
      // Реализация отображения ошибок в форме
      Object.keys(errors).forEach(field => {
          const input = document.querySelector(`[name="${field}"]`);
          if (input) {
              input.classList.add('is-invalid');
              const errorDiv = document.createElement('div');
              errorDiv.className = 'invalid-feedback';
              errorDiv.textContent = errors[field];
              input.parentNode.appendChild(errorDiv);
          }
      });
  }
</script>
