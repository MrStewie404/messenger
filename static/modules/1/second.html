<style>
    * {
      font-family: 'Avenir';
      font-size: 16px;
      text-decoration: none;
    }
    </style>
    
    <div style="background-color: black; border: solid rgb(27, 52, 194) 5px; border-radius: 10px;">
        <p id="text-output" style="padding: 0 auto; color: white; text-align: center;"></p>
    </div>
    
    
    <style>
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em; /* Настройка высоты курсора */
            background-color: black;
            margin-left: 2px; /* Отступ курсора */
            animation: blink-animation 1s steps(2, start) infinite;
        }
    
        @keyframes blink-animation {
            to {
                visibility: hidden;
            }
        }
    </style>
    </head>
    <body>
    <script>
        const textOutputElement = document.getElementById('text-output');
        const textArray = [
            "Здесь текст другой",
            "Тут текст другой"
        ];
    
        let textArrayIndex = 0;
        let charIndex = 0;
        const typingSpeed = 80; // Скорость печати (в миллисекундах)
    
        function typeText() {
            if (textArrayIndex < textArray.length) {
                const currentText = textArray[textArrayIndex];
                if (charIndex < currentText.length) {
                    textOutputElement.textContent += currentText.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeText, typingSpeed);
                } else {
                    // Добавляем курсор после завершения печати текущей строки
                    textArrayIndex++;
                    charIndex = 0;
    
                     // Задержка перед началом печати следующей строки
                     setTimeout(() => {
                         textOutputElement.innerHTML = "";
                        typeText()
                     }, 5000); // 1500 миллисекунд (5 секунд)
    
                }
            } else {
                // После завершения всей анимации вызываем typeText снова
                setTimeout(() => {
                    textOutputElement.innerHTML = "";
                    textArrayIndex = 0; // Сбрасываем индекс массива
                    typeText();
    
                }, 0) // задержка перед началом новой анимации
    
            }
        }
    
        typeText();
    </script>
