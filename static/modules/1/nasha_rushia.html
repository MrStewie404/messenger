<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Российский флаг</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flag">
        <div class="stripe white"></div>
        <div class="stripe blue"></div>
        <div class="stripe red"></div>
    </div>
</body>
</html>

<style>
    body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden; /* Чтобы убрать полосы прокрутки, если флаг немного выходит за границы */
}

    .flag {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .stripe {
        flex: 1;
    }

    .white {
        background-color: white;
    }

    .blue {
        background-color: #0039A6; /*  Синий цвет  */
    }

    .red {
        background-color: #D52B1E; /* Красный цвет */
    }
</style>
