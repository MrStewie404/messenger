<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пузырьки в Петри</title>
    <link rel="stylesheet" href="style.css">

<style>
* {
  font-family: 'Avenir';
  font-size: 16px;
  text-decoration: none;
}

body {
    margin: 0;
    display: block;  /* Изменяем flex на block */
    /* height: 100vh; Высота на весь viewport */
}
</style>
</head>
<body>
    <div style="background-color: black; border: solid rgb(194, 41, 27) 5px; border-radius: 10px; margin: 0;">
        <p id="text-output" style="color: white; text-align: center;"></p>
    </div>
</body>
<script>
    const textOutputElement = document.getElementById('text-output');
    const textArray = [
        "1110111 1101000 1101111 1100001 1110010 1100101 1110101",
        "Привет, мир",
        "Скоро релиз",
        "Данные обрабатываются.",
        "Шоу скоро начнётся",
        "Здесь ты ничего не найдёшь",
        "Кто ты?",
        "1101100 1101001 1101110 1101011 1110101 1110000",
        "Я знаю тебя?",
        "Ожидание ответа.",
        "Код выполняется...",
        "Ошибка исполнения"
    ];

    let textArrayIndex = 0;
    let charIndex = 0;
    const typingSpeed = 80; // Скорость печати (в миллисекундах)

    function typeText() {
        if (textArrayIndex < textArray.length) {
            const currentText = textArray[textArrayIndex];
            if (charIndex < currentText.length) {
                textOutputElement.textContent += currentText.charAt(charIndex);
                charIndex++;
                setTimeout(typeText, typingSpeed);
            } else {
                // Добавляем курсор после завершения печати текущей строки
                textArrayIndex++;
                charIndex = 0;

                 // Задержка перед началом печати следующей строки
                 setTimeout(() => {
                     textOutputElement.innerHTML = "";
                    typeText()
                 }, 5000); // 1500 миллисекунд (5 секунд)

            }
        } else {
            // После завершения всей анимации вызываем typeText снова
            setTimeout(() => {
                textOutputElement.innerHTML = "";
                textArrayIndex = 0; // Сбрасываем индекс массива
                typeText();

            }, 0) // задержка перед началом новой анимации

        }
    }

    typeText();
</script>
