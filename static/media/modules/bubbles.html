<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пузырьки в Петри</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="petri-dish"></div>
    <span class="blur-tag" style="width: 100%; height: 100%;"></span>

    <script src="script.js"></script>
</body>
</html>

<style>
    body {
    margin: 0;
    overflow: hidden;
    background-color: #000000;
    display: block;  /* Изменяем flex на block */
    height: 100vh; /* Высота на весь viewport */
    position: relative; /* Для позиционирования bubbles */
}

#petri-dish {
    position: absolute; /* Размещаем в левом верхнем углу */
    top: 0;
    left: 0;
    width: 100vw; /* Ширина на весь viewport */
    height: 100vh; /* Высота на весь viewport */
    overflow: hidden;
}

.bubble {
    position: absolute;
    border-radius: 50%;
    /* background-color: rgb(255, 0, 0); */
    pointer-events: none;
}

.blur-tag {
    display: inline-block; /* Или block если нужно блочное поведение */
    background-color: rgba(0, 0, 0, 0); /* Полупрозрачный фон для лучшего эффекта */
    /* padding: 5px 10px; */
    /* border-radius: 10px; */
    backdrop-filter: blur(10px); /* Применяем блюр */
    -webkit-backdrop-filter: blur(10px); /* Для совместимости с Safari */
    color: #333;
    font-weight: bold;
}
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
    const petriDish = document.getElementById('petri-dish');
    const bubbles = [];
    const numBubbles = 100;
    let petriWidth, petriHeight;

    function resizePetri() {
        petriWidth = window.innerWidth;
        petriHeight = window.innerHeight;
    }

    function createBubble() {
        const bubble = document.createElement('div');
        const size = Math.random() * 10 + 10;
        const x = Math.random() * (petriWidth - size);
        const y = Math.random() * (petriHeight - size);
        const dx = (Math.random() - 0.5) * 2;
        const dy = (Math.random() - 0.5) * 2;

        bubble.classList.add('bubble');
        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.backgroundColor = `rgb(${Math.random()*255}, ${Math.random()*0}, ${Math.random()*255})`;
        bubble.style.left = x + 'px';
        bubble.style.top = y + 'px';

        petriDish.appendChild(bubble);
        
        return {
          element: bubble,
          size: size,
          x: x,
          y: y,
          dx: dx,
          dy: dy
        };
    }

    function updateBubble(bubbleObj) {
        let x = bubbleObj.x + bubbleObj.dx;
        let y = bubbleObj.y + bubbleObj.dy;
    
        // Проверка столкновения со стенками
        if (x < 0 || x + bubbleObj.size > petriWidth) {
          bubbleObj.dx *= -1;
        }
        if (y < 0 || y + bubbleObj.size > petriHeight) {
          bubbleObj.dy *= -1;
        }
    
        // Проверка столкновения с другими пузырьками
        for (let otherBubbleObj of bubbles) {
          if (bubbleObj !== otherBubbleObj) {
              let dx = bubbleObj.x + bubbleObj.size - (otherBubbleObj.x + otherBubbleObj.size);
              let dy = bubbleObj.y + bubbleObj.size - (otherBubbleObj.y + otherBubbleObj.size);
              let distance = Math.sqrt(dx * dx + dy * dy);
              let minDistance = 0 // (bubbleObj.size + otherBubbleObj.size) / 2;

              if(distance < minDistance) {
                  // Столкновение произошло - меняем направления
                let nx = dx / distance;
                let ny = dy / distance;
                
                let dvx = bubbleObj.dx - otherBubbleObj.dx;
                let dvy = bubbleObj.dy - otherBubbleObj.dy;
                
                let dp = dvx * nx + dvy * ny;
                
                let k = (dp * 1.2) / 2; 
                
                bubbleObj.dx -= k * nx;
                bubbleObj.dy -= k * ny;
                
                otherBubbleObj.dx += k * nx;
                otherBubbleObj.dy += k * ny;
              }
          }
        }
        
        bubbleObj.x += bubbleObj.dx;
        bubbleObj.y += bubbleObj.dy;
        
        bubbleObj.element.style.left = bubbleObj.x + 'px';
        bubbleObj.element.style.top = bubbleObj.y + 'px';
    }

    function update() {
        for (let bubbleObj of bubbles) {
            updateBubble(bubbleObj);
        }
        requestAnimationFrame(update);
    }
    
    resizePetri();
    for(let i=0; i<numBubbles; i++) {
        bubbles.push(createBubble());
    }

    window.addEventListener('resize', resizePetri);
    
    update();
});

</script>
