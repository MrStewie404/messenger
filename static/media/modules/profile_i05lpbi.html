{% extends 'flatpages/default.html' %} 
{% load static %}

{% block content %}
<div style="display: flex; flex-direction: row; align-items: center; text-align: center;">
    <div>
      <img class="avatar" style="border: solid 4px beige;" src="/{{ avatar.path }}" alt="avatar" width="100" height="100">
      {% if user == request.user %}
          <div style="padding-left: 0px;">
            <a href="edit/" style="color: blue;">
              <p style="display: flex; gap: 5px; background-color: rgb(194, 41, 27); color: rgb(255, 255, 255); margin: 5px 10px; padding: 0 10px; border-radius: 5px; font-weight: 600;">
                Изменить
              </p>
            </a>
          </div>
        {% endif %}
    </div>
</div>
{% endblock %}
