<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link href="{% static 'default/styles.css' %}" rel="stylesheet">
    <title>Link up</title>
</head>

<style>
    .centered {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .logo {
        color: gray;
        filter: invert(42%) sepia(4%) saturate(7%) hue-rotate(341deg) brightness(92%) contrast(90%);
        transition: 0.2s all;
    }
    .logo:hover {
        filter: invert(99%) sepia(5%) saturate(267%) hue-rotate(34deg) brightness(117%) contrast(100%);
    }
</style>

<body>
    <div class="brand black" style="height: 50px;">
        <div class="box" style="justify-content: space-between;">
            <a class="centered logo" style="width: 40px; margin: 20px;" href="/about/">
                <img src="{% static 'default/logotype/logo.svg' %}" style="width: 30px;">
                <span style="margin-left: 10px;">LinkUp</span>
            </a>
            {% if user.is_authenticated %}
            <a style="color:rgb(255, 255, 255)" href="/profile/{{ user.id }}">
                <span>Профиль</span>
            </a>
            {% else %}
            <a style="color: rgb(255, 255, 255);" href="/login/">
                <span>Войти</span>
            </a>
            {% endif %}
        </div>
    </div>
    <div>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
